<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#071a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スマモン">
<title>スマモン (SmaMon)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/images/app-icon.png">
<link rel="apple-touch-icon" href="assets/images/app-icon.png">
<link rel="stylesheet" href="css/style.css?v=31">
</head>
<body>

  <!-- 1. ローディング画面 -->
  <div id="screen-loading" class="screen">
    <div class="logo-title">スマモン</div>
    <div class="loading-bar-track"><div id="loading-bar-fill" class="loading-bar-fill"></div></div>
    <div class="loading-label">Loading...</div>
  </div>

  <!-- 2. ログイン / 新規登録画面 -->
  <div id="screen-auth" class="screen hidden">
    <div class="logo-title small">スマモン</div>
    <div class="auth-box">
      <input type="text" id="auth-username" class="auth-input" placeholder="ユーザー名（半角英数字と_）" maxlength="20" autocomplete="username">
      <input type="password" id="auth-password" class="auth-input" placeholder="パスワード（6文字以上）" maxlength="50" autocomplete="current-password">
      <label class="auth-remember"><input type="checkbox" id="auth-remember"> ログイン情報をこの端末に保存</label>
      <div class="auth-storage-note">共用端末では保存しないでください</div>
      <div id="auth-error" class="auth-error hidden"></div>
      <button id="btn-auth-login" class="menu-btn">ログイン</button>
      <button id="btn-auth-signup" class="menu-btn auth-signup-btn">はじめて遊ぶ（新規登録）</button>
    </div>
  </div>

  <!-- 3. スタート画面 -->
  <div id="screen-start" class="screen hidden">
    <div class="logo-title">スマモン</div>
    <div class="tap-start">TAP START</div>
  </div>

  <!-- 4. ホーム画面 -->
  <div id="screen-home" class="screen hidden">
    <button id="home-profile-card" class="home-profile-card" title="タップでログアウト">
      <img id="home-profile-icon" src="assets/images/fighter/irumine/stock.png" alt="プロフィールアイコン">
      <span class="home-profile-info">
        <span class="home-profile-name"><b id="home-nickname">ブリーダー</b></span>
        <span class="home-breeder-line"><b id="home-breeder-level">ブリーダー Lv.1</b><small id="home-breeder-exp-text">0 / 100 EXP</small></span>
        <span class="home-breeder-exp"><i id="home-breeder-exp-fill"></i></span>
        <span class="home-profile-currency"><b id="home-diamonds">💎 0</b><b id="home-practice-tickets">修行券 0</b></span>
      </span>
    </button>
    <img class="home-logo" src="assets/images/logo.png" alt="大乱闘スマッシュモンスターズ">
    <div class="menu-list">
      <button class="menu-btn" id="btn-cpu">CPU戦</button>
      <button class="menu-btn" id="btn-multi">マルチ</button>
      <button class="menu-btn" id="btn-training">マスモン管理</button>
      <button class="menu-btn" id="btn-gacha">ガチャ</button>
    </div>
    <button id="btn-home-settings" class="icon-btn-corner" title="設定">⚙</button>
    <button id="btn-debug" class="debug-entry hidden">DEBUG</button>
  </div>

  <div id="screen-debug" class="screen hidden debug-screen">
    <div class="screen-heading">デバッグモード</div>
    <div class="debug-tabs"><button class="active">モーション確認</button><button disabled>BGM（今後追加）</button></div>
    <div class="debug-controls">
      <label>fighter<select id="debug-fighter-select"></select></label>
      <label>モーション<select id="debug-motion-select"></select></label>
    </div>
    <canvas id="debug-motion-canvas" width="420" height="300"></canvas>
    <button class="back-btn" data-back="home">戻る</button>
  </div>

  <!-- 4.5 マスモン管理 -->
  <div id="screen-masmon-manage" class="screen hidden">
    <img class="masmon-only-background" src="assets/images/masmon-manage-background.png?v=11" alt="マスモン管理">
    <button id="btn-manage-training" class="masmon-only-training" aria-label="トレーニングへ進む"></button>
    <button class="masmon-only-practice" data-back="practice" aria-label="修行へ進む"></button>
    <button class="masmon-only-skin" data-back="skin" aria-label="スキン変更へ進む"></button>
    <button class="masmon-only-back" data-back="home" aria-label="ホームへ戻る"></button>
    <div id="masmon-current-display" class="masmon-current-display">
      <img id="masmon-current-image" alt="選択中のマスモン">
      <div id="masmon-current-name"></div>
    </div>
    <div id="masmon-roster" class="masmon-roster"></div>
  </div>

  <!-- 4.6 トレーニング -->
  <div id="screen-training" class="screen hidden scrollable-screen">
    <img class="training-background" src="assets/images/training-background.png?v=24" alt="" aria-hidden="true">
    <div class="screen-heading">トレーニング</div>
    <div id="training-summary" class="training-summary"></div>
    <div id="training-list" class="training-list"></div>
    <div id="training-message" class="training-message" aria-live="polite"></div>
    <button class="back-btn" data-back="masmon-manage">戻る</button>
  </div>

  <div id="screen-practice" class="screen hidden">
    <div class="screen-heading">修行</div>
    <div class="coming-soon-panel">修行は近日実装予定です</div>
    <button class="back-btn" data-back="masmon-manage">戻る</button>
  </div>

  <div id="screen-skin" class="screen hidden">
    <div class="screen-heading">スキン変更</div>
    <div class="coming-soon-panel">スキン変更は近日実装予定です</div>
    <button class="back-btn" data-back="masmon-manage">戻る</button>
  </div>

  <!-- 5. 地形選択 -->
  <div id="screen-cpu-mode" class="screen hidden">
    <div class="screen-heading">CPU戦 モード選択</div>
    <div class="cpu-mode-list">
      <button id="btn-mode-1on1" class="cpu-mode-card"><strong>1 on 1</strong><small>CPUと1対1で対戦</small></button>
      <button id="btn-mode-hundred" class="cpu-mode-card"><strong>100人組手</strong><small>近日実装予定</small></button>
      <button id="btn-mode-endless" class="cpu-mode-card"><strong>エンドレスモード</strong><small>近日実装予定</small></button>
    </div>
    <button class="back-btn" data-back="home">戻る</button>
  </div>

  <div id="screen-stage-select" class="screen hidden">
    <div class="stage-select-heading"><img src="assets/images/app-icon.png" alt=""><span>ステージセレクト</span></div>
    <div id="stage-list" class="card-list"></div>
    <div class="stage-select-guide">ステージを選択してください</div>
    <button class="back-btn" data-back="cpu-mode">戻る</button>
  </div>

  <!-- 6. ファイター選択（CPU戦は1P/CPUのおはじきをファイターへ配置する） -->
  <div id="screen-fighter-select" class="screen hidden">
    <div class="screen-heading" id="fighter-select-heading">ファイター選択</div>
    <div id="token-bar" class="token-bar hidden"></div>
    <div id="fighter-list" class="card-list"></div>
    <button id="btn-fight-start" class="fight-start-btn hidden">FIGHT!</button>
    <button class="back-btn" data-back="stage-select">戻る</button>
  </div>

  <!-- 6.5 CPUレベル選択（CPU戦のみ） -->
  <div id="screen-cpu-level" class="screen hidden">
    <div class="screen-heading">CPUレベルを選択</div>
    <div id="cpu-level-list" class="level-grid"></div>
    <button class="back-btn" data-back="fighter-select">戻る</button>
  </div>

  <!-- 6.6 バトル開幕演出（Loading→FIGHT!） -->
  <div id="screen-battle-intro" class="screen hidden">
    <div id="battle-intro-loading" class="loading-label">Loading...</div>
    <div id="battle-intro-fight" class="fight-callout hidden">FIGHT !</div>
  </div>

  <!-- 7. バトル画面 -->
  <div id="screen-battle" class="screen hidden">
    <div id="game-container">
      <canvas id="gameCanvas" width="1400" height="1000"></canvas>
      <div id="hud"></div>
      <button id="battle-pause-btn" aria-label="ポーズ">Ⅱ</button>
      <div id="battle-pause-overlay" class="hidden">PAUSE</div>
      <div id="battle-countdown" class="hidden"><img id="battle-countdown-image" alt=""><span id="battle-countdown-text"></span></div>
    </div>
  </div>

  <!-- 8. リザルト画面 -->
  <div id="screen-result" class="screen hidden scrollable-screen result-screen">
    <div class="screen-heading">RESULT</div>
    <div class="result-main">
      <div id="result-podium" class="result-podium"></div>
      <div id="result-masmon-panel" class="result-masmon-panel hidden"></div>
    </div>
    <button id="btn-result-continue" class="menu-btn result-continue-btn">ホームへ戻る</button>
  </div>

  <div id="orientation-overlay">横向きにしてください</div>

  <script type="module" src="js/firebase-init.js"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/moves.js?v=27"></script>
  <script src="js/fighters/irumine-moves.js?v=30"></script>
  <script src="js/fighters/dullahan-moves.js?v=27"></script>
  <script src="js/physics.js?v=31"></script>
  <script src="js/fighter.js?v=34"></script>
  <script src="js/fighters-data.js"></script>
  <script src="js/debug-mode.js?v=2"></script>
  <script src="js/stage.js?v=31"></script>
  <script src="js/camera.js"></script>
  <script src="js/cpu-ai.js"></script>
  <script src="js/growth-system.js?v=27"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js?v=31"></script>
  <script src="js/flow.js?v=32"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
